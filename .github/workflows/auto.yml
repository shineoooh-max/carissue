name: Auto Article Publisher

on:
  schedule:
    # 한국 시간 기준 매일 오전 8시, 오후 6시 (UTC 23:00, 09:00)
    - cron: '0 23,9 * * *'
  workflow_dispatch: # 수동으로 즉시 1회 실행할 수 있는 버튼

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai beautifulsoup4

      - name: Run Builder Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python builder.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ index.html sitemap.xml published_links.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: publish 5 new articles" && git push origin main)
