name: Auto Article Publisher

on:
  schedule:
    - cron: '0 23,9 * * *'
  workflow_dispatch:
    inputs:
      design_only:
        description: '디자인만 반영 (체크 시 AI 기사 생성 안 함 / 토큰 비용 0원)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -U google-genai beautifulsoup4

      - name: Run Builder Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DESIGN_ONLY: ${{ github.event.inputs.design_only || 'false' }}
        run: |
          python -m py_compile config.py parser.py builder.py
          python builder.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: build site and articles"
            git push origin main
          fi
