<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARISSUE - 글로벌 신차 및 자동차 매거진</title>
    <meta name="description" content="글로벌 자동차 신차 정보 및 실시간 모터 트렌드 매거진">
    <link rel="icon" href="assets/favicon.ico">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3677274092490514" crossorigin="anonymous"></script>
    <style>
        :root { --primary: #e63946; --dark: #111827; --gray: #6b7280; --bg: #f9fafb; --card-bg: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; line-height: 1.6; color: #1f2937; background: var(--bg); }
        .container { max-width: 1140px; margin: 0 auto; padding: 0 20px; }
        
        /* 헤더 */
        .header { background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 100; }
        .nav-wrap { display: flex; justify-content: space-between; align-items: center; height: 64px; }
        .logo { display: flex; align-items: center; text-decoration: none; }
        .logo-img { height: 38px; width: auto; object-fit: contain; }
        .logo-text { font-size: 1.4rem; font-weight: 800; color: #111; letter-spacing: -0.5px; }
        .logo-text span { color: var(--primary); }

        /* 히어로 타이틀 */
        .hero { padding: 30px 0 15px; text-align: left; border-bottom: 2px solid #111; margin-bottom: 24px; }
        .hero h1 { font-size: 1.6rem; font-weight: 800; color: var(--dark); letter-spacing: -0.5px; }
        .hero p { color: var(--gray); font-size: 0.95rem; margin-top: 4px; }

        /* 애드센스 래퍼 (광고 미송출 시 높이 붕괴 방지 및 깔끔한 여백) */
        .ad-wrap { margin: 15px 0 25px; text-align: center; overflow: hidden; }

        /* 뉴스 그리드 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; padding-bottom: 60px; }
        .card { background: var(--card-bg); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; border: 1px solid #e5e7eb; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.07); }
        .card-thumb { width: 100%; height: 190px; background: #e5e7eb; overflow: hidden; }
        .card-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .card:hover .card-thumb img { transform: scale(1.03); }
        .card-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.1rem; font-weight: 700; line-height: 1.45; margin-bottom: 10px; color: #111; word-break: keep-all; }
        .card-date { font-size: 0.8rem; color: #9ca3af; margin-top: auto; }

        .footer { background: #111827; color: #9ca3af; padding: 30px 0; text-align: center; font-size: 0.85rem; }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; gap: 18px; }
            .hero h1 { font-size: 1.35rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container nav-wrap">
            <a href="/" class="logo">
                <img src="assets/logo.png" alt="CARISSUE" class="logo-img" onerror="this.outerHTML='<span class=\'logo-text\'>CAR<span>ISSUE</span></span>'">
            </a>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>LATEST MOTOR TRENDS</h1>
            <p>실시간 업데이트되는 글로벌 신차와 모터 트렌드 매거진</p>
        </section>

        <!-- 상단 반응형 광고 슬롯 -->
        <div class="ad-wrap">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-3677274092490514"
                 data-ad-slot="auto"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <section class="grid" id="news-grid">
            <!-- 기사 리스트 (빌더 및 워크플로우를 통해 최신순 업데이트 유지) -->
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 CARISSUE. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
