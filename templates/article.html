<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{POST_TITLE}} - CARISSUE</title>
    <meta name="description" content="{{POST_SUBTITLE}}">
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
    <link rel="canonical" href="{{SITE_URL}}/posts/{{POST_ID}}.html">
    <script type="application/ld+json">
    {{SCHEMA_JSON_LD}}
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ADSENSE_CLIENT}}" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-dark: #111215;
            --accent-red: #e11d48;
            --accent-gold: #d97706;
            --text-main: #18181b;
            --text-body: #27272a;
            --text-sub: #52525b;
            --border: #e4e4e7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
            color: var(--text-main);
            background: #ffffff;
            line-height: 1.6;
            letter-spacing: -0.02em;
        }
        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; height: auto; display: block; }

        /* 다크 매거진 헤더 */
        .site-header {
            background: var(--bg-dark);
            border-bottom: 2px solid var(--accent-red);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            min-height: 60px;
        }
        .logo img {
            height: 44px;
            width: auto;
            object-fit: contain;
        }
        @media (max-width: 600px) {
            .logo img { height: 36px; }
        }
        .logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.04em;
            color: #ffffff;
        }
        .logo-text span { color: var(--accent-red); }
        .main-nav { display: flex; align-items: center; gap: 24px; }
        .nav-item { color: #e4e4e7; font-size: 15px; font-weight: 700; }
        .nav-item:hover { color: var(--accent-gold); }

        /* 기사 레이아웃 */
        .post-layout {
            max-width: 1200px;
            margin: 36px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 44px;
        }
        @media (max-width: 920px) {
            .post-layout { grid-template-columns: 1fr; }
            .sidebar-wrap { display: none; }
        }

        /* 기사 헤더 타이포그래피 위계 */
        .badge-red {
            display: inline-block;
            background: var(--accent-red);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 3px;
            margin-bottom: 14px;
        }
        .post-title {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.32;
            color: var(--text-main);
            margin-bottom: 14px;
            word-break: keep-all;
        }
        @media (max-width: 600px) {
            .post-title { font-size: 25px; }
        }
        .post-sub {
            font-size: 18px;
            font-weight: 400;
            line-height: 1.55;
            color: var(--text-sub);
            margin-bottom: 20px;
            word-break: keep-all;
        }
        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            margin-bottom: 28px;
            font-size: 13px;
            color: #71717a;
        }
        .share-btn {
            background: #f4f4f5;
            border: 1px solid #d4d4d8;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-main);
        }
        .share-btn:hover { background: #e4e4e7; }

        /* 대표 이미지 */
        .featured-img-wrap {
            margin-bottom: 32px;
            border-radius: 8px;
            overflow: hidden;
            background: #f4f4f5;
        }
        .featured-img-wrap img { width: 100%; height: auto; }

        /* 본문 가독성 스타일 (17px 고정, 한 템포 호흡) */
        .post-content {
            font-size: 17px;
            font-weight: 400;
            line-height: 1.85;
            color: var(--text-body);
            margin-bottom: 40px;
        }
        .post-content p {
            font-size: 17px !important;
            font-weight: 400 !important;
            margin-bottom: 22px;
            word-break: keep-all;
        }
        .post-content h3 {
            font-size: 21px;
            font-weight: 800;
            line-height: 1.4;
            color: var(--text-main);
            margin: 38px 0 16px;
            padding-left: 12px;
            border-left: 4px solid var(--accent-red);
            word-break: keep-all;
        }
        .content-img {
            margin: 26px 0 30px;
            border-radius: 6px;
            overflow: hidden;
            background: #f4f4f5;
        }
        .content-img img { width: 100%; height: auto; }

        .ad-in-article { margin: 34px 0; text-align: center; }
        .ad-bottom { margin: 40px 0; }
        .ad-multiplex { margin: 36px 0; }

        .copyright-notice {
            font-size: 12px;
            color: #71717a;
            line-height: 1.6;
            background: #fafafa;
            border: 1px solid #f4f4f5;
            border-radius: 6px;
            padding: 12px 16px;
            margin: 36px 0 24px;
        }

        /* 추천 기사 */
        .related-wrap {
            margin-top: 44px;
            border-top: 2px solid var(--bg-dark);
            padding-top: 24px;
        }
        .related-title {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 20px;
        }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        @media (max-width: 640px) {
            .related-grid { grid-template-columns: 1fr; }
        }
        .rel-card { display: block; }
        .rel-thumb {
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 16 / 10;
            margin-bottom: 10px;
            background: #f4f4f5;
        }
        .rel-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .rel-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.42;
            color: var(--text-main);
        }
        .rel-card:hover .rel-title { color: var(--accent-red); }

        .sidebar-sticky {
            position: sticky;
            top: 84px;
            width: 300px;
            height: 600px;
        }

        /* 공유 모달 */
        .share-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.65);
            align-items: center;
            justify-content: center;
        }
        .share-modal-content {
            background: #fff;
            width: 90%;
            max-width: 360px;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }
        .share-title { font-size: 18px; font-weight: 800; margin-bottom: 18px; }
        .share-btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
        .share-act-btn {
            border: 1px solid #d4d4d8;
            background: #fafafa;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .share-act-btn:hover { background: #f4f4f5; }
        .share-close-btn {
            background: var(--bg-dark);
            color: #fff;
            border: none;
            padding: 10px 0;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        /* 다크 푸터 */
        .site-footer {
            background: var(--bg-dark);
            color: #a1a1aa;
            padding: 40px 20px;
            margin-top: 70px;
            text-align: center;
            border-top: 3px solid var(--accent-gold);
        }
        .footer-inner { max-width: 1200px; margin: 0 auto; }
        .footer-links { font-size: 14px; margin-bottom: 14px; }
        .footer-links a { color: #e4e4e7; margin: 0 8px; }
        .footer-links a:hover { color: var(--accent-gold); }
        .copyright { font-size: 13px; color: #71717a; }

        /* 상단 핵심 요약 박스 (왼쪽 이어지는 빨간 세로 라인) */
        .article-summary-box {
            border-left: 3px solid #e11d48;
            padding: 4px 0 4px 16px;
            margin: 0 0 32px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .summary-line {
            font-size: 17px;
            font-weight: 700;
            color: #111827;
            line-height: 1.45;
            letter-spacing: -0.02em;
        }

        /* 추천 뉴스 3칸 x 2줄 (총 6개) 그리드 */
        .related-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px 16px;
        }
        @media (max-width: 768px) {
            .related-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    {{SITE_HEADER}}

    <div class="post-layout">
        <main class="post-main">
            <span class="badge-red">{{POST_CATEGORY}}</span>
            <h1 class="post-title">{{POST_TITLE}}</h1>
            {{POST_SUBTITLE_HTML}}

            <div class="post-meta">
                <span>발행: {{POST_DATE}} | CARISSUE 편집국</span>
                <button type="button" class="share-btn" id="openShareModalBtn">공유</button>
            </div>

            <div class="featured-img-wrap">
                <img src="{{FEATURED_IMG}}" alt="{{POST_TITLE}}">
            </div>

            <article class="post-content">
                {{ARTICLE_CONTENT}}
            </article>

            {{COPYRIGHT_NOTICE}}

            <div class="ad-bottom">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="{{ADSENSE_CLIENT}}"
                     data-ad-slot="{{AD_SLOT_BOTTOM}}"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>

            <div class="ad-multiplex">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-format="autorelaxed"
                     data-ad-client="{{ADSENSE_CLIENT}}"
                     data-ad-slot="{{AD_SLOT_MULTIPLEX}}"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>

            <div class="related-wrap">
                <div class="related-title">CARISSUE 주요 추천 뉴스</div>
                <div class="related-grid">
                    {{RELATED_POSTS_HTML}}
                </div>
            </div>
        </main>

        <aside class="sidebar-wrap">
            <div class="sidebar-sticky">
                <ins class="adsbygoogle"
                     style="display:inline-block;width:300px;height:600px"
                     data-ad-client="{{ADSENSE_CLIENT}}"
                     data-ad-slot="{{AD_SLOT_SIDEBAR}}"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>
        </aside>
    </div>

    <div id="shareModal" class="share-modal">
        <div class="share-modal-content">
            <div class="share-title">기사 공유하기</div>
            <div class="share-btn-grid">
                <button type="button" class="share-act-btn" id="shareX">X (트위터)</button>
                <button type="button" class="share-act-btn" id="shareFB">페이스북</button>
                <button type="button" class="share-act-btn" id="copyUrl">URL 복사</button>
            </div>
            <button type="button" class="share-close-btn" id="closeShareModalBtn">닫기</button>
        </div>
    </div>

    {{SITE_FOOTER}}

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('shareModal');
            const openBtn = document.getElementById('openShareModalBtn');
            const closeBtn = document.getElementById('closeShareModalBtn');
            const pageUrl = window.location.href;
            const pageTitle = document.title;

            if (openBtn && modal) {
                openBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    modal.style.display = 'flex';
                });
            }
            if (closeBtn && modal) {
                closeBtn.addEventListener('click', function() {
                    modal.style.display = 'none';
                });
            }
            window.addEventListener('click', function(e) {
                if (e.target === modal) modal.style.display = 'none';
            });

            document.getElementById('shareX').addEventListener('click', function() {
                window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(pageTitle) + '&url=' + encodeURIComponent(pageUrl), '_blank');
            });
            document.getElementById('shareFB').addEventListener('click', function() {
                window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(pageUrl), '_blank');
            });
            document.getElementById('copyUrl').addEventListener('click', function() {
                navigator.clipboard.writeText(pageUrl).then(function() {
                    alert('기사 주소가 클립보드에 복사되었습니다.');
                    modal.style.display = 'none';
                }).catch(function() {
                    prompt('아래 URL을 복사하세요:', pageUrl);
                });
            });
        });
    </script>
</body>
</html>
