<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARISSUE - 글로벌 & 국내 자동차 전문 매거진</title>
    <meta name="description" content="신차 출시, 스파이샷, 업계 동향 및 시승기 등 가장 빠르고 정확한 프리미엄 자동차 뉴스 포털">
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
    <link rel="canonical" href="{{SITE_URL}}/">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ADSENSE_CLIENT}}" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-dark: #111215;
            --bg-charcoal: #1c1e24;
            --accent-red: #e11d48;
            --accent-gold: #d97706;
            --text-main: #18181b;
            --text-sub: #52525b;
            --border: #e4e4e7;
            --bg-page: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
            color: var(--text-main);
            background: var(--bg-page);
            line-height: 1.6;
            letter-spacing: -0.02em;
        }
        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; height: auto; display: block; }

        /* 다크 매거진 헤더 */
        .site-header {
            background: var(--bg-dark);
            border-bottom: 2px solid var(--accent-red);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.04em;
            color: #ffffff;
        }
        .logo-text span {
            color: var(--accent-red);
        }
        .main-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .nav-item {
            color: #e4e4e7;
            font-size: 15px;
            font-weight: 700;
            transition: color 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            color: #ffffff;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 4px;
        }

        /* 메인 컨테이너 */
        .main-container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 20px;
        }

        /* 상단 60:40 스플릿 탑 히어로 (Motor1 스타일) */
        .hero-split {
            display: grid;
            grid-template-columns: 6fr 4fr;
            gap: 32px;
            align-items: center;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
        }
        @media (max-width: 860px) {
            .hero-split { grid-template-columns: 1fr; gap: 18px; }
        }
        .hero-split-img {
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background: #18181b;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .hero-split-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .hero-split:hover .hero-split-img img {
            transform: scale(1.02);
        }
        .hero-split-body {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .hero-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .badge-red {
            background: var(--accent-red);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 3px;
        }
        .top-story-tag {
            color: var(--accent-gold);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .hero-split-body h1 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.32;
            color: var(--text-main);
            margin-bottom: 14px;
            word-break: keep-all;
        }
        .hero-split:hover .hero-split-body h1 {
            color: var(--accent-red);
        }
        .hero-split-body p {
            font-size: 15px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .meta-info {
            font-size: 13px;
            color: #71717a;
            font-weight: 500;
        }

        /* 중단 3열 서브 히어로 카드 */
        .sub-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }
        @media (max-width: 800px) {
            .sub-grid { grid-template-columns: 1fr; }
        }
        .sub-card {
            display: flex;
            flex-direction: column;
        }
        .sub-card-img {
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 16 / 10;
            background: #f4f4f5;
            margin-bottom: 12px;
        }
        .sub-card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .sub-card:hover .sub-card-img img {
            transform: scale(1.03);
        }
        .sub-card h3 {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.42;
            color: var(--text-main);
            margin: 6px 0 8px;
            word-break: keep-all;
        }
        .sub-card:hover h3 {
            color: var(--accent-red);
        }

        /* 중간 배너 광고 */
        .mid-ad-box {
            margin: 36px 0;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        /* 하단 최신 스토리 섹션 (좌측 리스트 + 우측 300x600 사이드바) */
        .section-heading {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.03em;
            color: var(--text-main);
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--bg-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-heading::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background: var(--accent-red);
        }
        .feed-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 40px;
        }
        @media (max-width: 920px) {
            .feed-layout { grid-template-columns: 1fr; }
            .side-column { display: none; }
        }
        .feed-item {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 22px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }
        @media (max-width: 600px) {
            .feed-item { grid-template-columns: 120px 1fr; gap: 14px; }
        }
        .feed-thumb {
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 16 / 10;
            background: #f4f4f5;
        }
        .feed-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .feed-content h4 {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-main);
            margin: 6px 0 8px;
            word-break: keep-all;
        }
        .feed-item:hover .feed-content h4 {
            color: var(--accent-red);
        }
        .feed-desc {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.55;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .sidebar-sticky {
            position: sticky;
            top: 84px;
            width: 300px;
            height: 600px;
        }

        /* 다크 푸터 */
        .site-footer {
            background: var(--bg-dark);
            color: #a1a1aa;
            padding: 40px 20px;
            margin-top: 70px;
            text-align: center;
            border-top: 3px solid var(--accent-gold);
        }
        .footer-inner { max-width: 1200px; margin: 0 auto; }
        .footer-links { font-size: 14px; margin-bottom: 14px; }
        .footer-links a { color: #e4e4e7; margin: 0 8px; }
        .footer-links a:hover { color: var(--accent-gold); }
        .copyright { font-size: 13px; color: #71717a; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="logo">
                <div class="logo-text">CAR<span>ISSUE</span></div>
            </a>
            <nav class="main-nav">
                <a href="/" class="nav-item active">최신뉴스</a>
                <a href="/about.html" class="nav-item">매체소개</a>
            </nav>
        </div>
    </header>

    <div class="main-container">
        <!-- 상단 60:40 스플릿 메인 기사 -->
        {{TOP_HERO_HTML}}

        <!-- 중단 3열 주요 기사 -->
        <div class="sub-grid">
            {{SUB_HEROES_HTML}}
        </div>

        <!-- 중단 디스플레이 광고 -->
        <div class="mid-ad-box">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="{{ADSENSE_CLIENT}}"
                 data-ad-slot="{{AD_SLOT_BOTTOM}}"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <!-- 하단 최신 스토리 피드 -->
        <div class="feed-layout">
            <div class="feed-column">
                <div class="section-heading">LATEST STORIES</div>
                {{FEED_LIST_HTML}}
            </div>
            <aside class="side-column">
                <div class="sidebar-sticky">
                    <ins class="adsbygoogle"
                         style="display:inline-block;width:300px;height:600px"
                         data-ad-client="{{ADSENSE_CLIENT}}"
                         data-ad-slot="{{AD_SLOT_SIDEBAR}}"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
                </div>
            </aside>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-links">
                <a href="/about.html">매체소개</a> &bull;
                <a href="/privacy.html">개인정보처리방침</a> &bull;
                <a href="/terms.html">이용약관</a> &bull;
                <a href="mailto:shineoooh@gmail.com">광고·제휴 문의</a>
            </div>
            <p class="copyright">&copy; 2026 CARISSUE. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
